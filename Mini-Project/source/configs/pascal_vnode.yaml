experiment_id: pascal-vnode

model:
  hidden_dim: 96
  num_heads: 8

architecture:
  num_layers: 4
  mpnn: gatedgcn
  task: node_classification

pe:
  type: lappe
  dim: 16

vnode:
  enabled: true
  num_node_types: 29
  num_edge_types: 5
  vnode_node_type: 28
  vnode_edge_type: 4

data:
  dataset: pascal_voc_sp
  batch_size: 32
  num_workers: 4

training:
  epochs: 300
  warmup_epochs: 10
  lr: 0.0005
  weight_decay: 0.0
  grad_clip: 1.0
