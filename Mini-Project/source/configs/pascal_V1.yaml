experiment_id: pascal-vnode-lappe-4L

data:
  dataset: pascal_voc_sp
  batch_size: 16
  num_workers: 4
  root: data

vnode:
  enabled: true
  num_node_types: 29
  num_edge_types: 5
  vnode_node_type: 28
  vnode_edge_type: 4

pe:
  type: lappe
  dim: 10

architecture:
  num_layers: 4
  mpnn: gine
  task: node_classification

training:
  epochs: 200
  warmup_epochs: 10
  lr: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
