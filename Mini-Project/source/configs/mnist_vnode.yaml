experiment_id: mnist-vnode

model:
  hidden_dim: 52
  num_heads: 4

architecture:
  num_layers: 3
  mpnn: gatedgcn
  task: graph_classification

pe:
  type: lappe
  dim: 8

vnode:
  enabled: true
  num_node_types: 29
  num_edge_types: 5
  vnode_node_type: 28
  vnode_edge_type: 4

data:
  dataset: mnist_sp
  batch_size: 16
  num_workers: 4

training:
  epochs: 100
  warmup_epochs: 5
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 1.0
