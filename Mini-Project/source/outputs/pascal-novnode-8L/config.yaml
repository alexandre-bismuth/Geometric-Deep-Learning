architecture:
  mpnn: gatedgcn
  num_layers: 8
  task: node_classification
data:
  batch_size: 32
  dataset: pascal_voc_sp
  num_workers: 16
  root: data
diagnostics:
  enabled: true
  max_graphs: 200
experiment_id: pascal-novnode-8L
logging:
  save_dir: outputs
  wandb_project: graph-transformer-sinks
model:
  attn_dropout: 0.5
  dropout: 0.0
  hidden_dim: 96
  num_heads: 8
pe:
  dim: 16
  type: lappe
training:
  epochs: 300
  grad_clip: 1.0
  lr: 0.0005
  warmup_epochs: 10
  weight_decay: 0.0
vnode:
  enabled: false
  num_edge_types: 4
  num_node_types: 28
  vnode_edge_type: 4
  vnode_node_type: 28
